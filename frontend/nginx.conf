# =============================================================================
# Nginx: serves the website AND forwards /api/ requests to the backend.
# =============================================================================
server {
    listen 8080;
    server_name _;

    server_tokens off;

    # Reject request bodies bigger than 1 MB (notes are tiny)
    client_max_body_size 1m;

    auth_basic "Notes";
    auth_basic_user_file /etc/nginx/htpasswd;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Compress text responses, so pages load faster
    gzip on;
    gzip_types text/css application/javascript application/json;

    # Docker's built-in DNS server. Look up "backend" again every 10 seconds,
    # so a recreated backend container (with a new address) is found.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_url http://backend:5000;

    root /usr/share/nginx/html;
    index index.html;

    # Nginx's own health check. It answers by itself, without the backend.
    location = /nginx-health {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API requests: forward them to the backend (the reverse proxy)
    location /api/ {
        proxy_pass $backend_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # Everything else: the website's files
    location / {
        try_files $uri $uri/ =404;
    }
}